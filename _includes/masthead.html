{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <a href="{{ base_path }}/" data-i18n-key="brand">{{ site.nav_title | default: "陈瑾辰" }}</a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}"{% if link.i18n_key %} data-i18n-key="{{ link.i18n_key }}"{% endif %}>{{ link.title }}</a>
            </li>
          {% endfor %}
          <li class="masthead__menu-item persist tail db-language-menu-item">
            <button class="db-language-toggle" type="button" data-language-toggle aria-label="切换到英文" title="切换到英文">
              <svg class="db-language-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7" />
                <path d="M3.5 12h17M12 3c2.4 2.4 3.6 5.4 3.6 9s-1.2 6.6-3.6 9c-2.4-2.4-3.6-5.4-3.6-9S9.6 5.4 12 3Z" fill="none" stroke="currentColor" stroke-width="1.5" />
              </svg>
              <span data-language-toggle-label>EN</span>
            </button>
          </li>
          <li id="theme-menu" class="masthead__menu-item persist tail">
            <details class="db-theme-menu" data-theme-menu>
              <summary id="theme-menu-button" data-i18n-aria-key="themeSettings" aria-label="主题设置" title="主题设置">
                <i id="theme-icon" class="fa-solid fa-desktop" aria-hidden="true"></i>
              </summary>
              <div class="db-theme-menu-options" role="menu" data-i18n-aria-key="themeOptions" aria-label="主题选项">
                <div role="menuitemradio" tabindex="0" data-theme-choice="system" data-i18n-key="themeSystem" aria-checked="true">跟随系统</div>
                <div role="menuitemradio" tabindex="0" data-theme-choice="light" data-i18n-key="themeLight" aria-checked="false">浅色</div>
                <div role="menuitemradio" tabindex="0" data-theme-choice="dark" data-i18n-key="themeDark" aria-checked="false">深色</div>
              </div>
            </details>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
