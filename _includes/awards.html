<link rel="stylesheet" href="/assets/css/table-sort.css?v=20261020-4">
<script src="/assets/js/table-sort.js?v=20261020-3"></script>

<table class="awards-table">
  <thead>
    <tr>
      <th data-i18n-key="date">时间</th>
      <th data-i18n-key="event">事件</th>
      <th data-i18n-key="award">奖项</th>
      <th data-i18n-key="level">等级</th>
    </tr>
  </thead>
  <tbody>
    {% assign sorted = site.data.awards | sort: "time" | reverse %}
    {% for row in sorted %}
    <tr>
      <td>{{ row.time }}</td>
      <td>{{ row.event }}</td>
      <td>{{ row.award }}</td>
      <td>{{ row.level }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
