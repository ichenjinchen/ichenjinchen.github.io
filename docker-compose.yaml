services:
  jekyll-site:
    image: jekyll-site
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/usr/src/app
    ports:
      - "4000:4000"
    environment:
      - JEKYLL_ENV=docker
    command: bundle exec jekyll serve -H 0.0.0.0 -w --config _config.yml,_config_docker.yml
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
